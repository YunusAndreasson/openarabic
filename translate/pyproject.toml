[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "translate"
version = "0.1.0"
description = "Arabic Translation Pipeline with AI-powered translation and database storage"
authors = [
    {name = "Yunus Andreasson", email = "yunus@edenmind.com"},
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.97.0",
    "pydantic>=2.11.7",
    "tqdm>=4.67.1",
    "supabase>=2.17.0",
    "python-dotenv>=1.1.1",
    "elevenlabs>=2.7.1",
    "setuptools>=80.9.0",
    "mutagen>=1.47.0",
    "google-cloud-translate>=3.21.1",
    "google-cloud-texttospeech>=2.18.0",
    "google-auth>=2.40.3",
    "camel-tools>=1.5.6",
    "pydub>=0.25.1",
    "pillow>=11.1.0",
    "rich>=14.0.0",
    "pyfiglet>=1.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12.4",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "mypy>=1.13.0",
    "vulture>=2.0.0",
    "types-requests>=2.32.4.20250809",
]

[tool.hatch.build.targets.wheel]
packages = ["translate"]

[tool.ruff]
# Same as Black.
line-length = 88

# Assume Python 3.12
target-version = "py312"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable comprehensive linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "TC",  # flake8-type-checking
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # Use of assert detected (allow in tests)
    "S603",  # subprocess call with untrusted input (legitimate uses for Python modules)
    "TC001", # Import typing only in TYPE_CHECKING
    "TC002", # Import typing only in TYPE_CHECKING
    "TC003", # Import typing only in TYPE_CHECKING
    "COM812", # Use of `dict.get()` with default value is redundant
    "ARG001", # Unused function argument (allow for API compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["translate"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011", "B017", "S101", "ARG001", "ARG002", "ARG005"]
"pipeline/validate*.py" = ["T201", "S110"]
"pipeline/check_validations.py" = ["T201"]
"utils/root_pattern_checker.py" = ["T201"]
"utils/validation_db.py" = ["T201", "N806", "F841"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests",
    "slow: Slow tests (skip with -m 'not slow')",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=audio",
    "--cov=data",
    "--cov=pipeline",
    "--cov=utils",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=40",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "*/tests/*",
    "test_*.py",
    "*_test.py",
]

[tool.coverage.report]
omit = [
    "tests/*",
    "*/tests/*",
    "test_*.py",
    "*_test.py",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true
explicit_package_bases = true
namespace_packages = true
exclude = [
    "tests/.*",
    ".*_test\\.py$",
    "test_.*\\.py$",
]
# Only disable error codes for genuinely unavoidable external library issues
disable_error_code = [
    "call-overload",  # OpenAI API complex overloads (external library)
    "import-untyped", # External libraries without type stubs (pydub, camel_tools)
]

[[tool.mypy.overrides]]
module = [
    "elevenlabs.*",
    "supabase.*",
    "openai.*",
    "tqdm.*",
    "mutagen.*",
    "PIL.*",
    "pyfiglet.*",
    "rich.*",
]
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
exclude = [
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "*/scripts/*",
    "*/node_modules/*",
]
