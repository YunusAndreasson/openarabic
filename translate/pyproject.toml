[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "translate"
version = "0.1.0"
description = "Arabic Translation Pipeline with AI-powered translation and database storage"
authors = [
    {name = "Yunus Andreasson", email = "yunus@edenmind.com"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.97.0",
    "pydantic>=2.11.7",
    "tqdm>=4.67.1",
    "supabase>=2.17.0",
    "python-dotenv>=1.1.1",
    "elevenlabs>=2.7.1",
    "setuptools>=80.9.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.4",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.12.4",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["translate"]

[tool.ruff]
# Same as Black.
line-length = 88

# Assume Python 3.12
target-version = "py312"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`), and isort (`I`) codes
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "TC",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # Use of assert detected (allow in tests)
    "S603",  # subprocess call with untrusted input (legitimate uses for Python modules)
    "TC001", # Import typing only in TYPE_CHECKING
    "TC002", # Import typing only in TYPE_CHECKING
    "TC003", # Import typing only in TYPE_CHECKING
    "COM812", # Use of `dict.get()` with default value is redundant
]

[tool.ruff.lint.isort]
known-first-party = ["translate"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011", "S101"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=translate",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=35",
]
