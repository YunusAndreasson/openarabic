[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "translate"
version = "0.1.0"
description = "Arabic Translation Pipeline with AI-powered translation and database storage"
authors = [
    {name = "Yunus Andreasson", email = "yunus@edenmind.com"},
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "supabase>=2.34.0",
    "python-dotenv>=1.2.4",
    "elevenlabs>=2.76.0",
    "setuptools>=84.2.1",
    "mutagen>=1.48.1",
    "google-cloud-translate>=3.28.0",
    "google-cloud-texttospeech>=2.38.0",
    "google-auth>=2.62.1",
    "camel-tools>=1.6.0",
    "pydub>=0.25.1",
    "rich>=15.0.0",
    "pyfiglet>=1.0.2",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.1",
    "vulture>=2.16",
    "types-requests>=2.33.0.20261030",
]

[tool.hatch.build.targets.wheel]
packages = ["translate"]

[tool.ruff]
# Same as Black.
line-length = 88

# Assume Python 3.12
target-version = "py312"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable comprehensive linting rules
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # bandit security
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "TC",   # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "RUF",  # Ruff-specific rules
    "PIE",  # Python antipatterns
    "PERF", # Performance antipatterns
    "SIM",  # Code simplification
    "LOG",  # Logging best practices
    "RET",  # Return statement consistency
    "PT",   # Pytest style
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "S101",   # Use of assert detected (allow in tests)
    "S603",   # subprocess call with untrusted input (legitimate uses)
    "S607",   # partial executable path (claude CLI from PATH)
    "TC001",  # Import typing only in TYPE_CHECKING
    "TC002",  # Import typing only in TYPE_CHECKING
    "TC003",  # Import typing only in TYPE_CHECKING
    "COM812", # Trailing comma (conflicts with formatter)
    "ARG001", # Unused function argument (allow for API compatibility)
    # RUF - Arabic unicode false positives
    "RUF001", # Ambiguous unicode in strings
    "RUF002", # Ambiguous unicode in docstrings
    "RUF003", # Ambiguous unicode in comments
    # SIM - stylistic preferences
    "SIM117", # Multiple with statements (clearer when nested)
    "SIM108", # Ternary expressions (if/else often clearer)
    # RET - debugging aid
    "RET504", # Unnecessary assign before return (aids debugging)
    # PERF - stylistic preferences
    "PERF401", # List comprehensions (explicit loops often clearer)
    # SIM - nested conditionals can be clearer with comments
    "SIM102", # Nested if statements
    # N804 - Pydantic validators don't always use cls parameter
    "N804", # First argument of class method should be cls
]

[tool.ruff.lint.isort]
known-first-party = ["translate"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011", "B017", "S101", "ARG001", "ARG002", "ARG005", "PT011"]
# CLI tools that use print for user interaction
"pipeline/extract.py" = ["T201"]
"utils/web_scraper.py" = ["T201"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests",
    "slow: Slow tests (skip with -m 'not slow')",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=audio",
    "--cov=data",
    "--cov=pipeline",
    "--cov=utils",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=40",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "*/tests/*",
    "test_*.py",
    "*_test.py",
]

[tool.coverage.report]
omit = [
    "tests/*",
    "*/tests/*",
    "test_*.py",
    "*_test.py",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true
explicit_package_bases = true
namespace_packages = true
exclude = [
    "tests/.*",
    ".*_test\\.py$",
    "test_.*\\.py$",
]
# Only disable error codes for genuinely unavoidable external library issues
disable_error_code = [
    "call-overload",  # OpenAI API complex overloads (external library)
    "import-untyped", # External libraries without type stubs (pydub, camel_tools)
]

[[tool.mypy.overrides]]
module = [
    "elevenlabs.*",
    "supabase.*",
    "openai.*",
    "mutagen.*",
    "pyfiglet.*",
    "rich.*",
]
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
exclude = [
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "*/scripts/*",
    "*/node_modules/*",
]
