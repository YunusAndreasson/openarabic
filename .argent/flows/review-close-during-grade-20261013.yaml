steps:
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: review-show-answer
  - tap: { id: review-show-answer }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: review-grade-known
  - await: { idle: true }
  - echo: Grade Knew it then press Android Back immediately, before the fade
      finishes; the pending grade must persist.
  - tool: run-sequence
    args:
      steps:
        - tool: gesture-tap
          args:
            x: 0.8045
            y: 0.924
          delayMs: 0
        - tool: button
          args:
            button: back
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Reviews this week.
  - await: { idle: true }
executionPrerequisite: Android QA account in unrevealed review on pixel
  emulator, portrait 1080x2400, at least two cards remaining.
