steps:
  - tap:
      text: Account
      role: FrameLayout
  - await:
      visible:
        text: Account
        role: StaticText
  - scroll-to:
      target:
        text: Theme
        role: Button
  - await:
      idle: true
  - tap:
      text: Theme, Dark
      role: Button
  - await:
      visible:
        text: Birches in Spring
        role: RadioButton
  - tap:
      text: Birches in Spring
      role: RadioButton
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Theme, Light
        role: Button
      timeoutMs: 10000
  - tool: button
    args:
      button: back
  - await:
      hidden:
        text: Birches in Spring
        role: RadioButton
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.4
      toX: 0.5
      toY: 0.7
      durationMs: 400
      momentum: false
  - tap:
      text: Practice
      role: FrameLayout
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Memory horizon.
        role: Button
      timeoutMs: 10000
  - tap:
      text: Reviews done, 7594. Opens the breakdown by how often each word has come
        up.
      role: Button
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: 2–4 times, 194 words
        role: Button
      timeoutMs: 10000
  - tap:
      text: 2–4 times, 194 words, still bedding in. Opens them in your dictionary.
      role: Button
  - tool: await-ui-element
