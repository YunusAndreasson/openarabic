executionPrerequisite: Android QA account in unrevealed review with at least two cards remaining.
steps:
  - await: { visible: { id: review-show-answer } }
  - echo: Double reveal must reveal one card without submitting a grade.
  - tap: { on: { id: review-show-answer }, times: 2 }
  - await: { visible: { id: review-grade-known } }
  - await: { idle: true }
  - echo: Double grade must advance once and restore a usable reveal control.
  - tap: { on: { id: review-grade-known }, times: 2 }
  - await: { hidden: { id: review-grade-known } }
  - await: { visible: { id: review-show-answer } }
  - await: { idle: true }
