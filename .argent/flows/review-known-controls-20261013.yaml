executionPrerequisite: Android QA account in unrevealed review with at least two words remaining.
steps:
  - await: { visible: { id: review-show-answer } }
  - echo: Reveal from the bottom control; expect grade choices and reveal control removed.
  - tap: { id: review-show-answer }
  - await: { hidden: { id: review-show-answer } }
  - await: { visible: { id: review-grade-known } }
  - await: { idle: true }
  - echo: Grade Knew it; expect grade control removed and a new reveal control.
  - tap: { id: review-grade-known }
  - await: { hidden: { id: review-grade-known } }
  - await: { visible: { id: review-show-answer } }
  - await: { idle: true }
