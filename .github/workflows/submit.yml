name: Submit

# Repository secrets it reads: EXPO_TOKEN, EXPO_APPLE_ID, EXPO_APPLE_APP_SPECIFIC_PASSWORD and
# GOOGLE_SERVICE_ACCOUNT_KEY.
# Without them it skips, so forks and pull requests stay green.

# Submit-only: pushes the LATEST finished EAS build for a platform to the store,
# without rebuilding. Use when a build already exists on EAS and only the store
# submission needs to (re)run (e.g. after fixing a Play Console declaration).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to submit (all, ios, or android)'
        required: false
        type: choice
        options:
          - all
          - ios
          - android
        default: all

permissions:
  contents: read

concurrency:
  group: submit
  cancel-in-progress: false

jobs:
  # A fork has none of the secrets below; skip instead of failing.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::EXPO_TOKEN isn't set, so the submission is skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  submit:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Yarn 4 comes from the `packageManager` field via Corepack. Without this
      # the runner's bundled Yarn 1 would try to read a Berry lockfile.
      # setup-node has no Corepack input, so its `cache: 'yarn'` would probe the
      # wrong Yarn and cache the wrong folder — hence the explicit cache below.
      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn global cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: yarn

      - name: Prepare Google Service Account file
        if: |
          github.event.inputs.platform == 'all' ||
          github.event.inputs.platform == 'android' ||
          github.event.inputs.platform == ''
        run: echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Submit Android to Google Play (Internal)
        if: |
          github.event.inputs.platform == 'all' ||
          github.event.inputs.platform == 'android' ||
          github.event.inputs.platform == ''
        run: eas submit --platform android --profile production --non-interactive --latest
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Submit iOS to TestFlight
        if: |
          github.event.inputs.platform == 'all' ||
          github.event.inputs.platform == 'ios' ||
          github.event.inputs.platform == ''
        run: eas submit --platform ios --profile production --non-interactive --latest
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}

      - name: Notify on failure
        if: failure()
        run: echo "❌ Submit failed"
