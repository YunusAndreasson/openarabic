name: Release

on:
  workflow_dispatch:
  push:
    branches: [root]
    paths: ['package.json']

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: bump version'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run validation
        run: yarn validate

      - name: Run tests
        run: yarn test

      - name: Check for unused code
        run: yarn knip:ci

      - name: Bump version (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          yarn bump
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          NEW_VERSION=$(node -p "require('./package.json').version")
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git add package.json app.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin $CURRENT_BRANCH
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          gh release create "v$NEW_VERSION" \
            --title "Release v$NEW_VERSION" \
            --generate-notes \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # === EAS Build and Update Steps (merged from eas.yaml) ===
      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: yarn

      - name: Install additional Expo and Babel packages
        run: |
          yarn add --dev babel-preset-expo @babel/plugin-transform-runtime metro-react-native-babel-preset
          yarn add expo-updates expo-asset

      - name: Publish update to Expo Go
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          eas update --branch $CURRENT_BRANCH --auto

      - name: Build and Submit to TestFlight
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          eas build --platform ios --profile production --auto-submit --non-interactive --branch $CURRENT_BRANCH
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ALLOW_FAILURE: true
          SENTRY_DISABLE_AUTO_UPLOAD: true
