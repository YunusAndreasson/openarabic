name: Release

on:
  workflow_dispatch:
  push:
    branches: [root]
    paths: ['package.json']

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: bump version'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run validation
        run: yarn validate

      # === EAS Build and Update Steps (run before version bumping) ===
      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: yarn

      - name: Install additional Expo and Babel packages
        run: |
          yarn add --dev babel-preset-expo @babel/plugin-transform-runtime metro-react-native-babel-preset

      - name: Publish update to Expo Go
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          eas update --branch $CURRENT_BRANCH --auto

      # === Version Bumping (before building so build has new version) ===
      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          yarn bump
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          NEW_VERSION=$(node -p "require('./package.json').version")
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          git add package.json app.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin $CURRENT_BRANCH
          git push origin "v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        id: version

      - name: Build for iOS
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_PUBLIC_UPDATES_ENABLED: 'true'
          EXPO_PUBLIC_UPDATES_CHECK_AUTOMATICALLY: 'ON_LOAD'
          EXPO_PUBLIC_UPDATES_FALLBACK_TO_CACHE_TIMEOUT: '0'
          NODE_PATH: '/github/workspace'

      - name: Build for Google Play
        run: eas build --platform android --profile production --auto-submit --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_PUBLIC_UPDATES_ENABLED: 'true'
          EXPO_PUBLIC_UPDATES_CHECK_AUTOMATICALLY: 'ON_LOAD'
          EXPO_PUBLIC_UPDATES_FALLBACK_TO_CACHE_TIMEOUT: '0'
          NODE_PATH: '/github/workspace'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ALLOW_FAILURE: true
          SENTRY_DISABLE_AUTO_UPLOAD: false
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      # === GitHub Release Creation (after successful build) ===
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && success() && steps.version.outputs.version
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"

          gh release create "v$NEW_VERSION" \
            --title "Release v$NEW_VERSION" \
            --notes "Automated release for version $NEW_VERSION" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: echo "❌ Release failed"
