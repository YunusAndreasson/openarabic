name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all, ios, or android)'
        required: false
        type: choice
        options:
          - all
          - ios
          - android
        default: all
  push:
    branches: [root]
    paths: ['package.json']

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: bump version'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Yarn 4 comes from the `packageManager` field via Corepack. Without this
      # the runner's bundled Yarn 1 would try to read a Berry lockfile.
      # setup-node has no Corepack input, so its `cache: 'yarn'` would probe the
      # wrong Yarn and cache the wrong folder — hence the explicit cache below.
      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn global cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      # The typed-routes declarations (app.json `typedRoutes`) live in
      # .expo/types, which the dev server writes and git ignores. Without them
      # every Href typechecks as a plain string and no route is checked.
      - name: Generate typed routes
        run: npx expo customize tsconfig.json

      - name: Run validation
        run: yarn verify

      # === EAS Build and Update Steps (run before version bumping) ===
      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: yarn

      - name: Prepare Google Service Account file
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Verify build dependencies
        run: |
          # Check that all required build dependencies are available
          yarn info --name-only | grep -E "(expo|@babel|metro)" || true
          echo "✅ Build dependencies verified"

          # Note: mixpanel-react-native expects async-storage ^1.21.0 but we use ^2.2.0
          # This is a peer dependency warning but doesn't break the build
          echo "⚠️  Peer dependency warning expected: mixpanel-react-native vs async-storage versions"

      - name: Publish update to Expo Go
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          eas update --branch $CURRENT_BRANCH --environment production --auto

      # === Version Bumping (before builds so they use new version) ===
      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          yarn bump
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          NEW_VERSION=$(node -p "require('./package.json').version")
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          git add package.json app.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin $CURRENT_BRANCH
          git push origin "v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        id: version

      # === Build Android First (for early testing) ===
      - name: Build for Android
        if: |
          github.event_name == 'push' ||
          !github.event.inputs.platform ||
          github.event.inputs.platform == 'all' ||
          github.event.inputs.platform == 'android'
        run: eas build --platform android --profile production --non-interactive --clear-cache
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_PUBLIC_UPDATES_ENABLED: 'true'
          EXPO_PUBLIC_UPDATES_CHECK_AUTOMATICALLY: 'ON_LOAD'
          EXPO_PUBLIC_UPDATES_FALLBACK_TO_CACHE_TIMEOUT: '0'
          NODE_PATH: '/github/workspace'
          # Sentry configuration
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: 'openarabic'
          SENTRY_PROJECT: 'react-native'
          SENTRY_DISABLE_AUTO_UPLOAD: 'false'
          SENTRY_ALLOW_FAILURE: 'true'
          # Analytics
          EXPO_PUBLIC_MIXPANEL_TOKEN: ${{ secrets.EXPO_PUBLIC_MIXPANEL_TOKEN }}
          # Google Sign-In
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          # Apple Sign-In (Android)
          EXPO_PUBLIC_APPLE_SERVICE_ID: ${{ secrets.EXPO_PUBLIC_APPLE_SERVICE_ID }}

      # === Submit Android to Google Play Store (Internal Testing) ===
      - name: Submit Android to Google Play (Internal)
        if: |
          github.event_name == 'push' ||
          !github.event.inputs.platform ||
          github.event.inputs.platform == 'all' ||
          github.event.inputs.platform == 'android'
        run: eas submit --platform android --profile production --non-interactive --latest
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_PUBLIC_UPDATES_ENABLED: 'true'
          EXPO_PUBLIC_UPDATES_CHECK_AUTOMATICALLY: 'ON_LOAD'
          EXPO_PUBLIC_UPDATES_FALLBACK_TO_CACHE_TIMEOUT: '0'
          NODE_PATH: '/github/workspace'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ALLOW_FAILURE: true
          SENTRY_DISABLE_AUTO_UPLOAD: false

      - name: Build for iOS
        if: |
          github.event_name == 'push' ||
          !github.event.inputs.platform ||
          github.event.inputs.platform == 'all' ||
          github.event.inputs.platform == 'ios'
        run: eas build --platform ios --profile production --non-interactive --clear-cache
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_NO_CAPABILITY_SYNC: '1'
          EXPO_PUBLIC_UPDATES_ENABLED: 'true'
          EXPO_PUBLIC_UPDATES_CHECK_AUTOMATICALLY: 'ON_LOAD'
          EXPO_PUBLIC_UPDATES_FALLBACK_TO_CACHE_TIMEOUT: '0'
          NODE_PATH: '/github/workspace'
          # Sentry configuration
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: 'openarabic'
          SENTRY_PROJECT: 'react-native'
          SENTRY_DISABLE_AUTO_UPLOAD: 'false'
          SENTRY_ALLOW_FAILURE: 'true'
          # Analytics
          EXPO_PUBLIC_MIXPANEL_TOKEN: ${{ secrets.EXPO_PUBLIC_MIXPANEL_TOKEN }}
          # Google Sign-In
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}

      # === Submit iOS to TestFlight ===
      - name: Submit iOS to TestFlight
        if: |
          github.event_name == 'push' ||
          !github.event.inputs.platform ||
          github.event.inputs.platform == 'all' ||
          github.event.inputs.platform == 'ios'
        run: |
          # Submit the most recent iOS build produced by this workflow to TestFlight
          eas submit --platform ios --profile production --non-interactive --latest
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_PUBLIC_UPDATES_ENABLED: 'true'
          EXPO_PUBLIC_UPDATES_CHECK_AUTOMATICALLY: 'ON_LOAD'
          EXPO_PUBLIC_UPDATES_FALLBACK_TO_CACHE_TIMEOUT: '0'
          NODE_PATH: '/github/workspace'

      # === GitHub Release Creation (after successful build) ===
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && success() && steps.version.outputs.version
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"

          gh release create "v$NEW_VERSION" \
            --title "Release v$NEW_VERSION" \
            --notes "Automated release for version $NEW_VERSION" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: echo "❌ Release failed"
