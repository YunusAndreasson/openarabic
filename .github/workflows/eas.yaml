name: Expo EAS Build and Update

on:
  push:
    branches:
      - root

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ALLOW_FAILURE: true
      SENTRY_DISABLE_AUTO_UPLOAD: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install additional Expo and Babel packages
        run: |
          yarn add --dev babel-preset-expo @babel/plugin-transform-runtime metro-react-native-babel-preset
          yarn add expo-updates expo-asset

      - name: Publish update to Expo Go
        run: eas update --auto

      - name: Build and Submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive
