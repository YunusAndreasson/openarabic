name: Promote

# Promote-only: moves a build that is ALREADY uploaded to Google Play from one
# track to another (normally internal -> production). Release/Submit stop at the
# internal track, so this is the step that puts a build in front of real users.
# Nothing is rebuilt and nothing is re-uploaded.
#
# Run with dry_run enabled first: it prints what every track currently holds
# and exits without touching Play.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code to promote (blank = highest in the source track)'
        required: false
        type: string
        default: ''
      from_track:
        description: 'Track to promote from'
        required: false
        type: choice
        options:
          - internal
          - alpha
          - beta
        default: internal
      rollout:
        description: 'Fraction of users, 0-1 (1.0 = full rollout)'
        required: false
        type: string
        default: '1.0'
      dry_run:
        description: 'Report track state and exit without changing anything'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  # A fork has no Play service account; skip instead of failing.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GOOGLE_SERVICE_ACCOUNT_KEY isn't set, so the promotion is skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  promote:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Prepare Google Service Account file
        run: echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Promote release
        run: |
          node scripts/promote-play-release.mjs \
            --key ./google-service-account.json \
            --from "${{ inputs.from_track }}" \
            --to production \
            --rollout "${{ inputs.rollout }}" \
            ${{ inputs.version_code != '' && format('--version-code {0}', inputs.version_code) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Notify on failure
        if: failure()
        run: echo "❌ Promote failed"
