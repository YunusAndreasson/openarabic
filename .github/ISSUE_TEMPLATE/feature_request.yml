name: Feature request
description: Something the app should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to read, practise or listen to, and where the app got in the way. A real situation helps more than a feature name.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working.
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: The workaround, if there is one (a dictionary, another app, a notebook…).
