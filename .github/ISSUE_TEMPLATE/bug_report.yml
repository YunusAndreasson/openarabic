name: Bug report
description: Something in the app doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what the app did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open a text from Explore …
        2. Tap …
  - type: input
    id: version
    attributes:
      label: App version
      description: It's at the bottom of the Account screen.
      placeholder: Version 1448.5.10 (283)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: iPhone 16, iOS 26.1
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: >
        If they help. Crop out your email address and anything else you
        wouldn't post publicly.
