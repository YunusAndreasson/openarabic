executionPrerequisite: Android reusable QA account on Practice, online, one existing due word seeded temporarily into all due-query cache variants. Restore saved cache and refetch after test.
steps:
  - tap: { text: Review }
  - await: { visible: { id: review-show-answer }, timeout: 20000 }
  - await: { idle: true }
  - tap: { id: review-show-answer }
  - await: { visible: { id: review-grade-known } }
  - await: { idle: true }
  - tap: { id: review-grade-known }
  - await: { visible: { text: Session complete } }
  - await: { idle: true }
  - assert: { visible: { text: '1 word reviewed' } }
  - tap: { text: Continue }
  - await: { visible: { text: 'Reviews this week.' } }
  - await: { idle: true }
