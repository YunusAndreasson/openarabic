executionPrerequisite: Android review open, microphone denied, Enable microphone visible; Android 15 English Settings.
steps:
  - tap: { text: Enable microphone }
  - await: { idle: true }
  - when: { visible: { text: App info } }
    steps:
      - tap: { text: Permissions / }
      - await: { visible: { text: Microphone / }, timeout: 5000 }
      - await: { idle: true }
      - tap: { text: Microphone / }
  - await:
      { visible: { id: com.android.permissioncontroller:id/allow_foreground_only_radio_button } }
  - await: { idle: true }
  - tap: { id: com.android.permissioncontroller:id/allow_foreground_only_radio_button }
  - tool: launch-app
    args: { bundleId: com.edenmind.OpenArabic }
  - await: { hidden: { text: Enable microphone, role: Button }, timeout: 10000 }
  - await: { visible: { id: review-show-answer }, timeout: 10000 }
  - await: { idle: true }
