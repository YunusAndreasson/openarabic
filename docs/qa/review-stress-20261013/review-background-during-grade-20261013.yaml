steps:
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: review-show-answer
  - tap: { id: review-show-answer }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: review-grade-known
  - await: { idle: true }
  - echo: Atomic Knew it tap followed immediately by Home tests an interruption
      during the grade animation. Point comes from the live grade-control frame;
      run-sequence has no selector-based atomic tap.
  - tool: run-sequence
    args:
      steps:
        - tool: gesture-tap
          args:
            x: 0.8045
            y: 0.924
          delayMs: 0
        - tool: button
          args:
            button: home
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: com.google.android.apps.nexuslauncher:id/workspace
  - await: { idle: true }
  - tool: launch-app
    args:
      bundleId: com.edenmind.OpenArabic
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: review-show-answer
  - await: { idle: true }
executionPrerequisite: Android QA account in unrevealed review on pixel
  emulator, portrait 1080x2400, at least two cards remaining.
