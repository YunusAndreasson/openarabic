executionPrerequisite: Android reusable QA account on Practice with cached due words and audio, Wi-Fi and cellular data disabled, Metro reachable via adb reverse.
steps:
  - tap: { text: Review }
  - await: { visible: { id: review-show-answer }, timeout: 20000 }
  - await: { idle: true }
  - tap: { id: review-show-answer }
  - await: { visible: { id: review-grade-vague } }
  - await: { idle: true }
  - tap: { id: review-grade-vague }
  - await: { hidden: { id: review-grade-vague } }
  - await: { visible: { id: review-show-answer } }
  - await: { idle: true }
  - tool: button
    args: { button: back }
  - await: { visible: { text: 'Reviews this week.' } }
  - await: { idle: true }
