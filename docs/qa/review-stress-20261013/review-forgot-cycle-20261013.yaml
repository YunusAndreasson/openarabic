executionPrerequisite: Android reusable Argent QA account in a running review session, unrevealed card with Show answer visible, and at least two words remaining.
steps:
  - echo: Reveal answer, grade Forgot, then continue to next prompt.
  - tap: { text: Show answer }
  - await: { visible: { text: Forgot } }
  - await: { idle: true }
  - tap: { text: Forgot }
  - await: { visible: { text: Continue } }
  - await: { idle: true }
  - tap: { text: Continue }
  - await: { visible: { text: Show answer } }
  - await: { idle: true }
